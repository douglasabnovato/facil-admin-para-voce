name: Deploy FacilAdmin Landing Page

on:
  push:
    branches:
      - main  # Altere para 'master' se essa for a sua branch principal

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Etapa 1: Checkout do código do repositório
      - name: Checkout Code
        uses: actions/checkout@v4

      # Etapa 2: Deploy para o GitHub Pages (usando a pasta raiz ou docs conforme sua configuração)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: . # Utiliza a raiz do projeto (onde está o index.html)